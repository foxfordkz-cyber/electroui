<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>3D пәтер</title>
<style>
  :root { --bg:#0A0F1E; --panel:rgba(18,25,44,.84); --stroke:rgba(255,255,255,.10); --text:#E8ECF8; --sub:#9AA6C2; --accent:#7FA4FF; --ok:#22C55E; --warn:#F59E0B; --bad:#EF4444; }
  body.light { --bg:#E9EEF8; --panel:rgba(255,255,255,.88); --stroke:rgba(18,26,46,.10); --text:#121A2E; --sub:#5B6680; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-tap-highlight-color:transparent; user-select:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .glass { background:var(--panel); border:1px solid var(--stroke); border-radius:18px; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 8px 30px rgba(0,0,0,.18); }
  .hud { position:fixed; left:12px; right:64px; top:12px; padding:12px 14px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .title { font-weight:700; font-size:15px; }
  .pill { font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; color:#fff; background:var(--ok); white-space:nowrap; }
  .big { font-size:26px; font-weight:800; margin:4px 0 6px; letter-spacing:-.5px; }
  .big small { font-size:13px; font-weight:500; color:var(--sub); letter-spacing:0; }
  .bar { height:8px; border-radius:4px; background:rgba(128,128,128,.25); overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; border-radius:4px; transition:width .7s cubic-bezier(.2,.8,.2,1), background .5s; }
  .sub { font-size:12px; color:var(--sub); margin-top:6px; }
  .tools { position:fixed; right:12px; top:12px; display:flex; flex-direction:column; gap:8px; }
  .tools button { width:44px; height:44px; border-radius:14px; border:1px solid var(--stroke); background:var(--panel); color:var(--text);
    font-size:18px; display:grid; place-items:center; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
  .tools button.on { background:var(--accent); color:#fff; border-color:transparent; }
  .hint { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); font-size:12px; padding:8px 14px; border-radius:16px; width:max-content; max-width:calc(100% - 24px); text-align:center; transition:opacity .5s; }
  .card { position:fixed; left:12px; right:12px; bottom:12px; padding:14px; transform:translateY(140%); transition:transform .38s cubic-bezier(.2,.9,.25,1.1); }
  .card.show { transform:none; }
  .card h3 { margin:0; font-size:18px; }
  .card .meta { font-size:12px; color:var(--sub); margin-top:2px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; }
  .chip { font-size:12px; padding:4px 9px; border-radius:99px; background:rgba(128,128,128,.16); font-weight:600; }
  .btns { display:flex; gap:8px; }
  .btn { flex:1; height:44px; border-radius:14px; border:0; font-weight:700; font-size:14px; color:#fff; background:var(--accent); }
  .btn.ghost { flex:0 0 auto; padding:0 14px; background:rgba(128,128,128,.18); color:var(--text); }
  .btn.off { background:var(--bad); }
  .toast { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%) scale(.9); opacity:0; padding:12px 16px; border-radius:16px;
    font-size:14px; font-weight:600; text-align:center; max-width:80%; transition:all .3s; pointer-events:none; }
  .toast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  .toast.bad { background:var(--bad); color:#fff; border-color:transparent; }
  .fallback { position:fixed; inset:0; display:none; place-items:center; text-align:center; padding:24px; }
  .x { position:absolute; right:10px; top:8px; background:none; border:0; color:var(--sub); font-size:20px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud glass">
  <div class="row"><span class="title">⚡ 3D пәтер</span><span class="pill" id="hState">ҚАЛЫПТЫ</span></div>
  <div class="big"><span id="hPower">0</span> Вт <small id="hCount"></small></div>
  <div class="bar"><i id="hBar"></i></div>
  <div class="sub" id="hSub"></div>
</div>

<div class="tools">
  <button id="bRotate" class="on" title="Автоайналдыру">⟳</button>
  <button id="bTop" title="Жоғарыдан қарау">⬒</button>
  <button id="bNight" title="Түнгі режим">☾</button>
  <button id="bReset" title="Бастапқы көрініс">⌂</button>
</div>

<div class="hint glass" id="hint">Саусақпен айналдырыңыз · екі саусақпен үлкейтіңіз · құралды басыңыз</div>

<div class="card glass" id="card">
  <button class="x" id="cClose">✕</button>
  <h3 id="cName"></h3>
  <div class="meta" id="cMeta"></div>
  <div class="chips" id="cChips"></div>
  <div class="btns">
    <button class="btn" id="cToggle"></button>
    <button class="btn ghost" id="cMore">Толығырақ</button>
  </div>
</div>

<div class="toast glass" id="toast"></div>
<div class="fallback" id="fallback"><div><div style="font-size:48px">🧊</div><b>3D көрініс бұл құрылғыда қолжетімсіз</b><p class="sub">WebGL қосылмаған. Қалған бөлімдер толық жұмыс істейді.</p></div></div>

<script src="three.min.js"></script>
<script>
(function () {
  'use strict';
  const A = window.Android || null;

  // ---------- браузерде тексеруге арналған демо деректер ----------
  const MOCK = {
    dark: true, accent: '#7FA4FF', limit: 7000, roomLimit: 3500, tariff: 25,
    rooms: [{id:1,name:'Ас үй',sockets:4},{id:2,name:'Қонақ бөлме',sockets:5},{id:3,name:'Жатын бөлме',sockets:3},{id:4,name:'Жуынатын бөлме',sockets:2}],
    items: [
      {id:1,type:'KETTLE',name:'Bosch TWK7203',typeName:'Электр шәйнек',power:2200,plugged:true,roomId:1,cls:'Kettle'},
      {id:2,type:'FRIDGE',name:'Panasonic NR-C320',typeName:'Тоңазытқыш',power:150,plugged:true,roomId:1,cls:'Refrigerator'},
      {id:3,type:'MICROWAVE',name:'Panasonic NN-GM333',typeName:'Микротолқынды пеш',power:1150,plugged:false,roomId:1,cls:'Microwave'},
      {id:4,type:'TV',name:'Samsung LA40C550',typeName:'Теледидар',power:110,plugged:true,roomId:2,cls:'Television'},
      {id:5,type:'AIRCON',name:'Panasonic CS-C10',typeName:'Кондиционер',power:900,plugged:false,roomId:2,cls:'AirConditioner'},
      {id:6,type:'LAMP',name:'Philips LED E27',typeName:'Шам',power:10,plugged:true,roomId:2,cls:'Lamp'},
      {id:7,type:'COMPUTER',name:'Gaming PC RGB',typeName:'Компьютер',power:450,plugged:false,roomId:2,cls:'Computer'},
      {id:8,type:'VACUUM',name:'Hitachi CV-HG5',typeName:'Шаңсорғыш',power:1600,plugged:false,roomId:2,cls:'VacuumCleaner'},
      {id:9,type:'HEATER',name:'Ballu Classic 9',typeName:'Майлы жылытқыш',power:2000,plugged:false,roomId:3,cls:'Heater'},
      {id:10,type:'FAN',name:'AEG Retro VL',typeName:'Желдеткіш',power:45,plugged:false,roomId:3,cls:'Fan'},
      {id:11,type:'LAMP',name:'Түнгі шам',typeName:'Шам',power:10,plugged:false,roomId:3,cls:'Lamp'},
      {id:12,type:'WASHER',name:'Samsung WW70',typeName:'Кір жуғыш машина',power:2000,plugged:false,roomId:4,cls:'WashingMachine'},
      {id:13,type:'IRON',name:'Hitachi CSI-M701',typeName:'Үтік',power:1400,plugged:false,roomId:4,cls:'Iron'}
    ]
  };

  function load() {
    try { return A ? JSON.parse(A.data()) : JSON.parse(JSON.stringify(MOCK)); }
    catch (e) { return JSON.parse(JSON.stringify(MOCK)); }
  }
  let data = load();
  document.body.classList.toggle('light', !data.dark);
  document.documentElement.style.setProperty('--accent', data.accent || '#7FA4FF');
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

  // ---------- рендерер ----------
  const canvas = $('c');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  } catch (e) {
    $('fallback').style.display = 'grid';
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const BG = data.dark ? 0x0A0F1E : 0xE9EEF8;
  scene.background = new THREE.Color(BG);
  scene.fog = new THREE.Fog(BG, 34, 70);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
  const ACCENT = new THREE.Color(data.accent || '#7FA4FF');

  const hemi = new THREE.HemisphereLight(0xffffff, data.dark ? 0x334066 : 0x99a3b8, data.dark ? 0.55 : 0.8);
  const sun = new THREE.DirectionalLight(0xffffff, data.dark ? 0.6 : 0.9);
  sun.position.set(9, 16, 8);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 50 });
  scene.add(hemi, sun);

  // ---------- көмекшілер ----------
  const M = (color, o) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.55, metalness: 0.08 }, o || {}));
  function mesh(geo, mat, x, y, z, parent) {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x || 0, y || 0, z || 0);
    m.castShadow = true; m.receiveShadow = true;
    if (parent) parent.add(m);
    return m;
  }
  const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
  const cyl = (rt, rb, h, s) => new THREE.CylinderGeometry(rt, rb, h, s || 24);

  function label(text, opts) {
    opts = opts || {};
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    const size = opts.size || 44;
    ctx.font = 'bold ' + size + 'px Roboto, sans-serif';
    const w = Math.ceil(ctx.measureText(text).width) + 40;
    c.width = w; c.height = size + 28;
    ctx.font = 'bold ' + size + 'px Roboto, sans-serif';
    ctx.fillStyle = opts.bg || (data.dark ? 'rgba(20,27,45,.85)' : 'rgba(255,255,255,.92)');
    const r = c.height / 2;
    ctx.beginPath(); ctx.moveTo(r, 0); ctx.lineTo(w - r, 0); ctx.arc(w - r, r, r, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(r, c.height); ctx.arc(r, r, r, Math.PI / 2, Math.PI * 1.5); ctx.fill();
    ctx.fillStyle = opts.color || (data.dark ? '#E8ECF8' : '#121A2E');
    ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    ctx.fillText(text, w / 2, c.height / 2 + 2);
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
    const k = (opts.scale || 0.9) / c.height;
    s.scale.set(w * k, c.height * k, 1);
    s.renderOrder = 10;
    return s;
  }

  // ---------- пәтердің жоспары ----------
  const ROOM_W = 6.4, ROOM_D = 5.2, WALL_H = 1.3, WALL_T = 0.14;
  const ROOM_COLORS = [0xE8C9A0, 0x9FB8E8, 0xC2A9E8, 0x9FD9D0, 0xE8B0A8, 0xB8E0A0];
  const world = new THREE.Group();
  scene.add(world);
  let roomRects = {};
  const panelPos = new THREE.Vector3();

  function buildApartment() {
    world.clear();
    roomRects = {};
    const n = data.rooms.length || 1;
    const cols = 2, rows = Math.ceil(n / cols);
    const W = cols * ROOM_W, D = rows * ROOM_D;
    const x0 = -W / 2, z0 = -D / 2;

    const base = mesh(box(W + 1.2, 0.3, D + 1.2), M(data.dark ? 0x1B2440 : 0xCDD5E6), 0, -0.16, 0, world);
    base.castShadow = false;

    data.rooms.forEach((r, i) => {
      const cx = x0 + (i % cols) * ROOM_W, cz = z0 + Math.floor(i / cols) * ROOM_D;
      roomRects[r.id] = { x: cx, z: cz, w: ROOM_W, d: ROOM_D, index: i, slot: 0 };
      const floorColor = new THREE.Color(ROOM_COLORS[i % ROOM_COLORS.length]);
      if (data.dark) floorColor.multiplyScalar(0.55);
      const floor = mesh(box(ROOM_W - 0.04, 0.06, ROOM_D - 0.04), M(floorColor, { roughness: 0.8 }), cx + ROOM_W / 2, 0.0, cz + ROOM_D / 2, world);
      floor.castShadow = false;
      const l = label(r.name + ' · ' + r.sockets + ' розетка', { scale: 0.6 });
      l.position.set(cx + ROOM_W / 2, 0.25, cz + ROOM_D / 2 + 0.4);
      world.add(l);
    });

    const wallMat = M(data.dark ? 0x2A3556 : 0xF5F7FB, { roughness: 0.9 });
    // сыртқы қабырғалар
    mesh(box(W, WALL_H, WALL_T), wallMat, 0, WALL_H / 2, z0, world);
    mesh(box(WALL_T, WALL_H, D), wallMat, x0, WALL_H / 2, 0, world);
    mesh(box(WALL_T, WALL_H, D), wallMat, x0 + W, WALL_H / 2, 0, world);
    const front = mesh(box(W, 0.35, WALL_T), wallMat, 0, 0.175, z0 + D, world);
    front.castShadow = false;
    // ішкі қабырғалар (есік ойықтарымен)
    for (let c = 1; c < cols; c++) {
      const x = x0 + c * ROOM_W;
      for (let r = 0; r < rows; r++) {
        const zs = z0 + r * ROOM_D;
        mesh(box(WALL_T, WALL_H, ROOM_D * 0.36), wallMat, x, WALL_H / 2, zs + ROOM_D * 0.18, world);
        mesh(box(WALL_T, WALL_H, ROOM_D * 0.36), wallMat, x, WALL_H / 2, zs + ROOM_D * 0.82, world);
      }
    }
    for (let r = 1; r < rows; r++) {
      const z = z0 + r * ROOM_D;
      for (let c = 0; c < cols; c++) {
        const xs = x0 + c * ROOM_W;
        mesh(box(ROOM_W * 0.38, WALL_H, WALL_T), wallMat, xs + ROOM_W * 0.19, WALL_H / 2, z, world);
        mesh(box(ROOM_W * 0.38, WALL_H, WALL_T), wallMat, xs + ROOM_W * 0.81, WALL_H / 2, z, world);
      }
    }

    // электр щиті
    const panel = new THREE.Group();
    mesh(box(0.18, 0.9, 0.62), M(0x8A94A8, { metalness: 0.5, roughness: 0.35 }), 0, 0, 0, panel);
    for (let k = 0; k < 4; k++)
      mesh(box(0.04, 0.12, 0.08), M(0x22C55E, { emissive: 0x22C55E, emissiveIntensity: 1.2 }), 0.11, 0.18, -0.21 + k * 0.14, panel);
    panel.position.set(x0 + 0.12, 0.9, z0 + ROOM_D);
    world.add(panel);
    panelPos.set(x0 + 0.3, 0.05, z0 + ROOM_D);
    const pl = label('Электр щиті', { scale: 0.5, bg: 'rgba(34,197,94,.92)', color: '#fff' });
    pl.position.set(x0 + 0.5, 1.75, z0 + ROOM_D);
    world.add(pl);
  }

  // құралдың орны: бөлме ішіндегі «слоттар»
  const SCALE = 1.35;
  const SLOTS = [[1.1, 1.0], [5.2, 1.0], [3.2, 2.7], [1.1, 4.1], [5.2, 4.1], [3.2, 1.0], [3.2, 4.3], [1.1, 2.6], [5.2, 2.6], [2.2, 1.9], [4.3, 3.5]];
  function slotFor(roomId) {
    const r = roomRects[roomId] || Object.values(roomRects)[0];
    const s = SLOTS[r.slot % SLOTS.length];
    r.slot++;
    return new THREE.Vector3(r.x + s[0], 0.03, r.z + s[1]);
  }

  // ---------- құралдардың 3D модельдері ----------
  const anims = [];
  function counter(g, w) { mesh(box(w || 1.0, 0.82, 0.62), M(0x8B5E3C, { roughness: 0.7 }), 0, 0.41, 0, g); return 0.82; }

  const BUILD = {
    FRIDGE(g, st) {
      mesh(box(0.78, 1.9, 0.68), M(0xDDE2EA, { metalness: 0.35, roughness: 0.3 }), 0, 0.95, 0, g);
      mesh(box(0.79, 0.02, 0.69), M(0x5B6680), 0, 1.25, 0, g);
      mesh(box(0.04, 0.4, 0.05), M(0x5B6680, { metalness: 0.6 }), 0.3, 1.5, 0.36, g);
      mesh(box(0.04, 0.5, 0.05), M(0x5B6680, { metalness: 0.6 }), 0.3, 0.8, 0.36, g);
      const led = mesh(box(0.2, 0.06, 0.01), M(0x111827, { emissive: 0x38BDF8, emissiveIntensity: 0 }), -0.15, 1.55, 0.345, g);
      st.on.push(() => led.material.emissiveIntensity = 1.6);
      st.off.push(() => led.material.emissiveIntensity = 0);
      return 1.9;
    },
    KETTLE(g, st) {
      const top = counter(g, 0.9);
      mesh(cyl(0.2, 0.22, 0.05), M(0x1F2937), 0, top + 0.025, 0, g);
      const water = mesh(cyl(0.16, 0.19, 0.34), M(0x93C5FD, { transparent: true, opacity: 0.75, emissive: 0x2563EB, emissiveIntensity: 0 }), 0, top + 0.22, 0, g);
      mesh(cyl(0.17, 0.17, 0.04), M(0x111827), 0, top + 0.41, 0, g);
      const handle = mesh(new THREE.TorusGeometry(0.12, 0.025, 8, 16, Math.PI), M(0x111827), 0.19, top + 0.24, 0, g);
      handle.rotation.z = -Math.PI / 2;
      const steam = [];
      for (let k = 0; k < 6; k++) {
        const p = mesh(new THREE.SphereGeometry(0.05, 8, 8), M(0xffffff, { transparent: true, opacity: 0 }), 0, top + 0.5, 0, g);
        p.castShadow = false; p.userData.o = k / 6; steam.push(p);
      }
      st.on.push(() => water.material.emissiveIntensity = 0.9);
      st.off.push(() => { water.material.emissiveIntensity = 0; steam.forEach(p => p.material.opacity = 0); });
      st.tick = (t) => steam.forEach(p => {
        const f = (t * 0.5 + p.userData.o) % 1;
        p.position.set(Math.sin(f * 9 + p.userData.o * 6) * 0.06, top + 0.48 + f * 0.9, 0);
        p.scale.setScalar(0.6 + f * 1.6); p.material.opacity = 0.55 * (1 - f);
      });
      return top + 0.45;
    },
    MICROWAVE(g, st) {
      const top = counter(g, 0.9);
      mesh(box(0.66, 0.38, 0.44), M(0xF3F4F6, { roughness: 0.4 }), 0, top + 0.19, 0, g);
      const win = mesh(box(0.42, 0.26, 0.01), M(0x111827, { emissive: 0xF59E0B, emissiveIntensity: 0 }), -0.07, top + 0.19, 0.225, g);
      mesh(box(0.12, 0.26, 0.01), M(0x9CA3AF), 0.24, top + 0.19, 0.225, g);
      st.on.push(() => win.material.emissiveIntensity = 0.9);
      st.off.push(() => win.material.emissiveIntensity = 0);
      st.tick = (t) => win.material.emissiveIntensity = 0.7 + Math.sin(t * 6) * 0.2;
      return top + 0.4;
    },
    WASHER(g, st) {
      mesh(box(0.72, 0.86, 0.66), M(0xF9FAFB, { roughness: 0.35 }), 0, 0.43, 0, g);
      mesh(new THREE.TorusGeometry(0.22, 0.04, 12, 32), M(0x9CA3AF, { metalness: 0.6 }), 0, 0.42, 0.34, g);
      const glass = mesh(new THREE.CircleGeometry(0.2, 32), M(0x1E3A8A, { transparent: true, opacity: 0.85, emissive: 0x3B82F6, emissiveIntensity: 0 }), 0, 0.42, 0.335, g);
      const drum = new THREE.Group(); drum.position.set(0, 0.42, 0.336); g.add(drum);
      mesh(box(0.34, 0.05, 0.01), M(0xE5E7EB), 0, 0, 0, drum);
      mesh(box(0.05, 0.34, 0.01), M(0xE5E7EB), 0, 0, 0, drum);
      mesh(box(0.5, 0.06, 0.02), M(0x374151), 0, 0.8, 0.33, g);
      st.on.push(() => glass.material.emissiveIntensity = 0.5);
      st.off.push(() => glass.material.emissiveIntensity = 0);
      st.tick = (t, dt) => { drum.rotation.z += dt * 8; g.position.x = g.userData.base.x + Math.sin(t * 40) * 0.006; };
      return 0.86;
    },
    VACUUM(g, st) {
      const body = mesh(new THREE.SphereGeometry(0.3, 20, 16), M(0x2563EB, { roughness: 0.3 }), 0, 0.22, 0, g);
      body.scale.set(1, 0.7, 1.3);
      mesh(cyl(0.08, 0.08, 0.05), M(0x111827), 0.24, 0.08, 0.15, g).rotation.z = Math.PI / 2;
      mesh(cyl(0.08, 0.08, 0.05), M(0x111827), -0.24, 0.08, 0.15, g).rotation.z = Math.PI / 2;

  // ---------- құралдар мен кабельдер ----------

  function buildAppliances() {
    items.forEach(o => world.remove(o.group));
    items.clear();
    pickables.length = 0;
    Object.values(roomRects).forEach(r => r.slot = 0);
    data.items.forEach(it => {
      const g = new THREE.Group();
      const st = { on: [], off: [], tick: null };
      const h = (BUILD[it.type] || BUILD.LAMP)(g, st);
      const pos = slotFor(it.roomId);
      if (it.type === 'AIRCON' && roomRects[it.roomId]) pos.z = roomRects[it.roomId].z + 0.78; // қабырғаға ілінеді
      g.position.copy(pos);
      g.scale.setScalar(SCALE);
      g.userData.base = pos.clone();
      g.userData.id = it.id;
      g.traverse(o => { if (o.isMesh) { o.userData.id = it.id; pickables.push(o); } });
      const ring = new THREE.Mesh(new THREE.RingGeometry(0.5, 0.58, 40), new THREE.MeshBasicMaterial({ color: 0x9AA6C2, transparent: true, opacity: 0.6, side: THREE.DoubleSide }));
      ring.rotation.x = -Math.PI / 2; ring.position.y = 0.045; g.add(ring);
      const bolt = label('⚡ ' + fmt(it.power) + ' Вт', { scale: 0.42, bg: 'rgba(250,204,21,.95)', color: '#111827' });
      bolt.position.y = h + 0.35; g.add(bolt);
      // розетка (қабырғадағы ақ пластина)
      const r = roomRects[it.roomId];
      const sock = new THREE.Group();
      mesh(box(0.2, 0.2, 0.03), M(0xffffff), 0, 0, 0, sock);
      mesh(cyl(0.02, 0.02, 0.02, 8), M(0x111827), -0.04, 0, 0.02, sock).rotation.x = Math.PI / 2;
      mesh(cyl(0.02, 0.02, 0.02, 8), M(0x111827), 0.04, 0, 0.02, sock).rotation.x = Math.PI / 2;
      if (r) { sock.position.set(pos.x, 0.32, r.z + WALL_T / 2 + 0.02); world.add(sock); }
      world.add(g);
      items.set(it.id, { group: g, state: st, item: it, ring, bolt, socket: sock, height: h });
    });
    applyStates(true);
  }

  function applyStates(first) {
    // кабельдер: щит → розетка → құрал
    cables.children.slice().forEach(c => {
      if (c.geometry) c.geometry.dispose();
      cables.remove(c);
    });
    flows = [];
    items.forEach(o => {
      const it = data.items.find(x => x.id === o.item.id) || o.item;
      o.item = it;
      (it.plugged ? o.state.on : o.state.off).forEach(f => f());
      o.ring.material.color.set(it.plugged ? 0x22C55E : 0x9AA6C2);
      o.bolt.visible = it.plugged;
      if (!first && o.wasOn !== it.plugged) pop(o.group);
      o.wasOn = it.plugged;
      if (!it.plugged) return;
      const p = o.group.userData.base;
      const sock = o.socket.position;
      const pts = [panelPos.clone(), new THREE.Vector3(panelPos.x + 0.4, 0.06, panelPos.z),
        new THREE.Vector3(sock.x, 0.06, panelPos.z + (sock.z - panelPos.z) * 0.5),
        new THREE.Vector3(sock.x, 0.06, sock.z + 0.12), new THREE.Vector3(sock.x, 0.3, sock.z + 0.04),
        new THREE.Vector3(sock.x, 0.06, sock.z + 0.2), new THREE.Vector3(p.x, 0.06, p.z)];
      const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.2);
      const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 80, 0.022, 6), new THREE.MeshStandardMaterial({ color: ACCENT, emissive: ACCENT, emissiveIntensity: 0.6 }));
      cables.add(tube);
      const n = Math.min(7, 2 + Math.round(it.power / 450));
      for (let k = 0; k < n; k++) {
        const dot = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), new THREE.MeshBasicMaterial({ color: 0xFFE066 }));
        cables.add(dot);
        flows.push({ curve, dot, o: k / n, speed: 0.12 + Math.min(0.35, it.power / 7000) });
      }
    });
    updateHud();
  }

  function pop(g) {
    const t0 = performance.now();
    (function step() {
      const k = Math.min(1, (performance.now() - t0) / 450);
      const s = SCALE * (1 + Math.sin(k * Math.PI) * 0.18);
      g.scale.setScalar(s);
      if (k < 1) requestAnimationFrame(step); else g.scale.setScalar(SCALE);
    })();
  }

  function updateHud() {
    const on = data.items.filter(i => i.plugged);
    const total = on.reduce((s, i) => s + i.power, 0);
    const pct = total / data.limit * 100;
    $('hPower').textContent = fmt(total);
    $('hCount').textContent = '· ' + on.length + ' / ' + data.items.length + ' құрал розеткада';
    const bar = $('hBar');
    bar.style.width = Math.min(100, pct) + '%';
    const color = pct > 100 ? 'var(--bad)' : pct > 75 ? 'var(--warn)' : 'var(--ok)';
    bar.style.background = color;
    const st = $('hState');
    st.textContent = pct > 100 ? 'ШАМАДАН ТЫС' : pct > 75 ? 'ЖОҒАРЫ' : 'ҚАЛЫПТЫ';
    st.style.background = color;
    const kwh = on.reduce((s, i) => s + i.power * (i.hours || 1) / 1000, 0);
    $('hSub').textContent = Math.round(pct) + '% · шегі ' + fmt(data.limit) + ' Вт · ток ' + (total / 220).toFixed(1).replace('.', ',') +
      ' А · айына ≈ ' + fmt(kwh * 30 * data.tariff) + ' ₸';
  }

  // ---------- камера басқару ----------
  const target = new THREE.Vector3(0, 0.4, 0);
  const view = { theta: 0.65, phi: 0.95, r: 22 };
  const goal = { theta: 0.65, phi: 0.95, r: 22 };
  let autoRotate = true, lastInteract = 0;
  function defaultView() { goal.theta = 0.65; goal.phi = 0.95; goal.r = innerWidth < innerHeight ? 33 : 20; }
  defaultView(); Object.assign(view, goal);

  const pointers = new Map();
  let downPos = null, pinchStart = 0, rStart = 0;
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    downPos = { x: e.clientX, y: e.clientY, t: performance.now() };
    if (pointers.size === 2) { pinchStart = dist(); rStart = goal.r; }
    lastInteract = performance.now();
    $('hint').style.opacity = 0;
  });
  canvas.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      goal.theta -= (e.clientX - prev.x) * 0.006;
      goal.phi = Math.max(0.12, Math.min(1.45, goal.phi - (e.clientY - prev.y) * 0.005));
    } else if (pointers.size === 2 && pinchStart > 0) {
      goal.r = Math.max(7, Math.min(45, rStart * pinchStart / dist()));
    }
    lastInteract = performance.now();
  });
  const up = e => {
    if (pointers.size === 1 && downPos && Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) < 8 && performance.now() - downPos.t < 450) pick(e.clientX, e.clientY);
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStart = 0;
  };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('wheel', e => { e.preventDefault(); goal.r = Math.max(7, Math.min(45, goal.r * (1 + e.deltaY * 0.001))); }, { passive: false });
  function dist() { const p = [...pointers.values()]; return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1; }

  // ---------- таңдау ----------
  const ray = new THREE.Raycaster();
  let selected = null, helper = null;
  function pick(x, y) {
    const v = new THREE.Vector2(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1);
    ray.setFromCamera(v, camera);
    const hit = ray.intersectObjects(pickables, false)[0];
    if (!hit) { closeCard(); return; }
    select(hit.object.userData.id);
  }
  function select(id) {
    const o = items.get(id);

    selected = id;

    $('cMeta').textContent = it.typeName + ' · ' + (room ? room.name : '') + ' · class ' + it.cls;
    $('cChips').innerHTML = '';

    });
    const btn = $('cToggle');

    btn.classList.toggle('off', it.plugged);
  }
  function closeCard() {
    $('card').classList.remove('show');
    selected = null;
    if (helper) { scene.remove(helper); helper = null; }
  }
  $('cClose').addEventListener('click', closeCard);
  $('cToggle').addEventListener('click', () => {
    const o = items.get(selected);
    if (!o) return;
    if (A) {
      let res;
      try { res = JSON.parse(A.toggle(String(o.item.id))); } catch (e) { toast('Қате: ' + e.message, true); return; }
      toast(res.message, !res.ok || res.overload);
      if (res.data) data = res.data;
    } else {
      o.item.plugged = !o.item.plugged;
      const m = data.items.find(x => x.id === o.item.id); m.plugged = o.item.plugged;
      toast((m.plugged ? 'Розеткаға қосылды: ' : 'Ажыратылды: ') + m.name, false);

  let toastTimer = 0;
  function toast(msg, bad) {
    const t = $('toast');
    t.textContent = msg; t.classList.toggle('bad', !!bad); t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  // ---------- құралдар тақтасы ----------
  let night = false;
  $('bRotate').addEventListener('click', e => { autoRotate = !autoRotate; e.currentTarget.classList.toggle('on', autoRotate); });
  $('bTop').addEventListener('click', () => { goal.phi = 0.12; goal.r = innerWidth < innerHeight ? 30 : 22; });
  $('bReset').addEventListener('click', () => { defaultView(); closeCard(); });
  $('bNight').addEventListener('click', e => {
    night = !night; e.currentTarget.classList.toggle('on', night);
    hemi.intensity = night ? 0.12 : (data.dark ? 0.55 : 0.8);

  // ---------- Android-нан жаңарту ----------
  window.refresh = function () {
    const fresh = load();
    const sameSet = fresh.items.length === data.items.length && fresh.items.every(i => items.has(i.id));
    data = fresh;
    if (sameSet) applyStates(false); else { buildApartment(); buildAppliances(); }
    if (selected != null) { if (items.has(selected)) renderCard(); else closeCard(); }
  };

  // ---------- цикл ----------
  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();
  buildApartment();
  buildAppliances();

  let prev = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    const t = now / 1000;
    if (autoRotate && now - lastInteract > 2500 && pointers.size === 0) goal.theta += dt * 0.12;
    view.theta += (goal.theta - view.theta) * 0.12;
    view.phi += (goal.phi - view.phi) * 0.12;
    view.r += (goal.r - view.r) * 0.12;
    camera.position.set(target.x + view.r * Math.sin(view.phi) * Math.sin(view.theta),
      target.y + view.r * Math.cos(view.phi), target.z + view.r * Math.sin(view.phi) * Math.cos(view.theta));
    camera.lookAt(target);

    items.forEach(o => {
      if (o.item.plugged && o.state.tick) o.state.tick(t, dt);
      if (o.item.plugged) {
        o.ring.material.opacity = 0.45 + Math.sin(t * 4) * 0.3;
        o.bolt.position.y = o.height + 0.35 + Math.sin(t * 2.5 + o.item.id) * 0.06;
      }
    });
    flows.forEach(f => {
      const u = (t * f.speed + f.o) % 1;
      f.curve.getPointAt(u, f.dot.position);
    });
    if (helper) helper.update();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(() => $('hint').style.opacity = 0, 6000);
})();
</script>
</body>
</html>
